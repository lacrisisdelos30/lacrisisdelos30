<title>La Crisis de los 30 · Plataforma</title>
<style>
/* Concepto: réplica de la versión final aprobada: sitio oscuro con grano azul, tarjetas translúcidas y acentos cian. */
:root{
  --bg:#050709; --panel:rgba(16,56,86,.78); --row:#0a2133; --line:#1c4660;
  --ink:#F4F6F8; --mut:#8FA9BA; --cy:#22B8CF; --red:#D8392E; --deep:#033247; --field:#0b5a73;
  --f-d:'Unbounded',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-d);font-size:14px;line-height:1.4;margin:0;min-height:100%}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:end;margin-bottom:20px}
.top h2{font-size:clamp(16px,2.2vw,22px);font-weight:800;letter-spacing:.04em}
.top p{margin:8px 0 0;color:var(--mut);max-width:62ch;font-weight:400;font-size:12px;line-height:1.6}
.tag{font:700 10px/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--cy);border:1px solid var(--cy);padding:7px 10px;border-radius:99px;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tabs button{font:700 10px var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);background:transparent;border:1px solid var(--line);padding:10px 14px;border-radius:99px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#05070A;border-color:var(--ink)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}.phone{justify-self:center}}
.lbl{font:700 10px var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.desk{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000}
.chrome{display:flex;gap:6px;align-items:center;padding:9px 12px;background:#0b141c;border-bottom:1px solid var(--line)}
.chrome i{width:9px;height:9px;border-radius:50%;background:#2a3a48}
.chrome span{margin-left:10px;font:400 10px var(--f-d);color:var(--mut);background:var(--bg);padding:4px 12px;border-radius:99px}
.phone .shell{border:7px solid #1a242e;border-radius:34px;overflow:hidden;height:660px;background:#000}
.scroll{height:100%;overflow-y:auto}
.desk .scroll{height:auto;max-height:680px}

/* sitio */
.site{container-type:inline-size;position:relative;min-height:100vh;max-width:1920px;margin:0 auto;background-color:#000;
  background-image:radial-gradient(ellipse at 50% 30%,rgba(20,90,130,.32),transparent 60%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .15  0 0 0 0 .55  0 0 0 0 .75  0 0 0 .8 -.3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.hdr{display:flex;align-items:center;gap:2cqw;background:#101010;padding:14px 2.4cqw;min-height:clamp(64px,5.5cqw,110px)}
.logo{display:block;height:clamp(40px,4.1cqw,82px);flex:none}
.logo svg{height:100%;width:auto;display:block}
.nav{margin-left:auto;display:flex;align-items:center;gap:clamp(10px,1.3cqw,26px);font:400 clamp(10px,.78cqw,15px)/1 Arial,Helvetica,sans-serif;text-transform:uppercase;color:#fff;letter-spacing:0}
.nav i{display:inline-block;width:5px;height:5px;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(45deg) translateY(-2px);margin-left:6px}
.nav a{text-decoration:none;color:#fff;padding:1.05cqw 1.1cqw;border-radius:3px;white-space:nowrap}
.nav .b1{background:#1dc6db}.nav .b2{background:#cebca0}
.ls{height:clamp(30px,2.6cqw,52px);width:auto;display:block}
.burger{display:none;width:22px;height:2px;background:#fff;box-shadow:0 7px #fff,0 -7px #fff;margin-left:auto;margin-right:4px}
.hero-d{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.hero-m{display:none}
.hero-m img{width:100%;height:auto;display:block}
.hero-m p{margin:6px 18px 0;text-align:center;font:700 10px/1.5 var(--f-d);letter-spacing:.12em;text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5cqw;padding:2cqw 7cqw 24px}
.card{background:var(--panel);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 0 0 1px rgba(34,184,207,.06)}
.card .k{font:800 11px var(--f-d);letter-spacing:.2em;color:var(--cy)}
.card h3{font:800 clamp(13px,1.9cqw,19px)/1.15 var(--f-d);letter-spacing:.1em;text-transform:uppercase;margin:0}
.card p{margin:0;font:400 clamp(11px,1.3cqw,14px)/1.5 var(--f-d);letter-spacing:.06em;color:#e7eef3}
.card .hl{color:var(--cy);font-weight:700}
.cta{margin-top:auto;font:800 clamp(11px,1.45cqw,15px) var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:#000;border:0;border-radius:8px;padding:16px 10px;cursor:pointer;width:100%;text-align:center}
.cta:hover,.cta[aria-expanded="true"]{background:var(--ink);color:#000}
.panel{margin:0 7cqw 24px;border-radius:14px;padding:26px 26px;background:var(--panel)}
.ph{font:800 clamp(12px,1.7cqw,18px) var(--f-d);letter-spacing:.16em;text-transform:uppercase;color:var(--cy);display:inline-block;border-bottom:1px solid var(--cy);padding-bottom:6px;margin:0 0 18px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 26px}
.chip{font:800 clamp(11px,1.5cqw,16px) var(--f-d);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:var(--row);border:0;border-radius:8px;padding:20px 8px;cursor:pointer}
.chip[aria-pressed="true"]{background:#000}
.det{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.q{font:800 clamp(18px,3.6cqw,38px)/1.05 var(--f-d);letter-spacing:.06em;text-transform:uppercase;margin:0 0 14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pair div{border-top:2px solid var(--cy);padding-top:8px;font:400 12px/1.5 var(--f-d);letter-spacing:.05em}
.pair b{display:block;font:800 10px var(--f-d);letter-spacing:.18em;color:var(--cy);margin-bottom:4px}
.pair div+div{border-color:var(--red)}.pair div+div b{color:var(--red)}
.qrow{display:flex;align-items:center;gap:12px;background:var(--row);border-radius:10px;padding:16px 20px;margin-bottom:12px}
.qrow span{flex:1;min-width:0;font:400 clamp(11px,1.5cqw,16px) var(--f-d);letter-spacing:.14em;text-transform:uppercase}
.join{font:400 clamp(11px,1.5cqw,16px) var(--f-d);letter-spacing:.08em;color:var(--cy);background:none;border:0;text-decoration:underline;cursor:pointer;white-space:nowrap}
.join[aria-pressed="true"]{color:var(--ink);font-weight:700}
.yq{display:flex;gap:12px;align-items:center;background:var(--row);border-radius:10px;padding:8px 10px 8px 20px}
.yq input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:400 clamp(11px,1.5cqw,16px) var(--f-d);letter-spacing:.06em;padding:10px 0}
.yq input::placeholder{color:#b9cad6}
.send{font:800 11px var(--f-d);letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:#000;border:0;border-radius:8px;padding:13px 18px;cursor:pointer;white-space:nowrap}
.ok{background:var(--row);border:1px solid var(--cy);border-radius:10px;padding:16px;font:700 12px/1.5 var(--f-d);letter-spacing:.06em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-start;justify-content:center;padding:6cqw 4cqw;z-index:5;overflow:auto}
.sheet{width:100%;max-width:640px;background:var(--deep);border-radius:22px;padding:26px 28px}
.sheet h3{font:800 clamp(20px,3.6cqw,38px)/1 var(--f-d);letter-spacing:.1em;color:var(--cy);text-transform:uppercase;margin:0 0 8px}
.sheet .s{font:500 clamp(12px,1.6cqw,16px)/1.4 var(--f-d);letter-spacing:.06em;margin:0 0 18px}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.field label{font:800 clamp(12px,1.7cqw,17px) var(--f-d);letter-spacing:.16em;text-transform:uppercase}
.field select,.field textarea{font:400 13px/1.5 var(--f-d);letter-spacing:.05em;color:var(--ink);background:var(--field);border:0;border-radius:8px;padding:14px;width:100%}
.field textarea{min-height:110px;resize:vertical}
.field textarea::placeholder{color:#cde6ee}
.cnt{font:400 10px var(--f-d);color:#9fd0dc;text-align:right;letter-spacing:.06em}
.act{display:flex;justify-content:flex-end}
.act .send{padding:18px 26px;font-size:clamp(11px,1.5cqw,15px)}
.x{float:right;background:none;border:0;color:#9fd0dc;font-size:22px;cursor:pointer;line-height:1}
.foottxt{margin-top:24px;color:var(--mut);font:400 11px/1.6 var(--f-d);max-width:90ch}
@container (max-width:620px){
  .hero-d{display:none}.hero-m{display:block}
  .nav,.ls{display:none}.burger{display:block}.hdr{padding:12px 16px}.logo{height:38px}
  .cards{grid-template-columns:minmax(0,1fr);gap:14px;padding:12px 16px 20px}
  .card h3{font-size:14px}.card p{font-size:11px}.cta{font-size:11px}
  .panel{margin:0 16px 20px;padding:16px}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .chip{font-size:10px;padding:14px 4px}
  .pair{grid-template-columns:1fr}
  .qrow{flex-direction:column;align-items:flex-start;gap:8px;padding:14px}
  .qrow span{font-size:11px}.join{font-size:11px}
  .yq{flex-wrap:wrap;padding:10px 12px}.yq input{font-size:11px;flex-basis:100%}
  .modal{padding:16px 10px}.sheet{padding:18px}
  .ph{font-size:11px}
}
@media (prefers-reduced-motion:no-preference){.panel,.sheet{animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
</style>

  h+='<div class="site" data-k="'+k+'">';
  h+='<header class="hdr"><a class="logo" href="#" aria-label="El Ojo de Iberoamérica">'+LOGO+'</a><nav class="nav" aria-label="Principal"><span>Festival <i></i></span><span>Premio <i></i></span><span>Noticias</span><span>Auspicios <i></i></span><span>Contacto</span><a class="b1" href="#">Inscribite al premio</a><a class="b2" href="#">Compra tu entrada</a></nav><img class="ls" alt="LatinSpots.com" src="'+IMG.ls+'"><span class="burger" aria-hidden="true"></span></header>';
  h+='<img class="hero-d" alt="La crisis de los 30. Si es un problema, es una oportunidad para la creatividad iberoamericana." src="'+IMG.hero+'">';
  h+='<div class="hero-m"><img alt="La crisis de los 30" src="'+IMG.sign+'"><p>Si es un problema, es una oportunidad para la creatividad iberoamericana</p></div>';
  h+='<section class="cards">';
  h+='<article class="card"><span class="k">1. MIRAR</span><h3>30 años mirando más allá</h3><p>Nuevas herramientas, nuevas voces. Revisemos lo que dábamos por cierto.</p><button class="cta" data-go="crisis" aria-expanded="'+(s.scene==='crisis')+'">Crisis de la industria</button></article>';
  h+='<article class="card"><span class="k">2. RESOLVER</span><h3>Iberoamérica resuelve</h3><p>Compartí tu idea, la misma tendrá soporte de referentes de la región para hacerlas realidad.</p><p class="hl">¡30 ideas serán seleccionadas!</p><button class="cta" data-go="idea">Sumá tu mirada</button></article>';
  h+='<article class="card"><span class="k">3. CUESTIONAR</span><h3>¿Hay más dudas que respuestas?</h3><p>Compartí tus preguntas. Las debatimos en el foro y en el festival.</p><button class="cta" data-go="foro" aria-expanded="'+(s.scene==='foro')+'">Preguntas</button></article>';
  h+='</section>';

  if(s.scene==='crisis'){
    h+='<section class="panel"><div class="chips">';
    C.forEach(function(x,i){h+='<button class="chip" data-sel="'+i+'" aria-pressed="'+(i===s.sel)+'">'+esc(x[0])+'</button>'});
    h+='</div><div class="det"><p class="q">'+esc(c[1])+'</p><div class="pair"><div><b>A LOS 30</b>'+esc(c[2])+'</div><div><b>EN LA INDUSTRIA</b>'+esc(c[3])+'</div></div></div></section>';
  }
  if(s.scene==='foro'){
    h+='<section class="panel"><p class="ph">Las más compartidas – sugerencias</p>';
    Q.forEach(function(x,i){var j=s.joined[i];h+='<div class="qrow"><span>'+esc(x[0])+'</span><button class="join" data-join="'+i+'" aria-pressed="'+(!!j)+'">Yo también - '+kfmt(x[1]+(j?1:0))+'</button></div>'});
    h+='<p class="ph" style="margin-top:18px;border:0;padding:0">Tu pregunta</p>';
    if(s.qsent){h+='<div class="ok">Pregunta enviada. La debatimos en el foro y en el festival.</div>'}
    else{h+='<div class="yq"><input id="q-'+k+'" data-q value="'+esc(s.q)+'" maxlength="120" placeholder="Escribinos tu duda y la debatimos en el festival" aria-label="Tu pregunta"><button class="send" data-sendq>Compartir</button></div>'}
    h+='</section>';
  }

  if(s.scene==='idea'){
    h+='<div class="modal"><div class="sheet" role="dialog" aria-label="Sumá tu mirada"><button class="x" data-close aria-label="Cerrar">×</button><h3>Sumá tu mirada</h3><p class="s">Elegí una crisis y cómo podemos resolverla</p>';
    if(s.sent){h+='<div class="ok">Idea enviada. La lee un referente de la región. Se eligen 30.</div>'}
    else{
      h+='<div class="field"><label for="cr-'+k+'">Crisis</label><select id="cr-'+k+'" data-cr>';
      C.forEach(function(x,i){h+='<option value="'+i+'"'+(i===s.sel?' selected':'')+'>'+esc(x[0])+'</option>'});
      h+='</select></div><div class="field"><label for="id-'+k+'">Tu idea</label><textarea id="id-'+k+'" data-idea placeholder="¿Cómo la resolverías? Compartí tu idea y la hacemos realidad junto a un referente.">'+esc(s.idea)+'</textarea><div class="cnt"><span data-cnt>'+words(s.idea)+'</span>/100 palabras</div></div>';
      h+='<div class="field"><label for="pa-'+k+'">País</label><select id="pa-'+k+'" data-pa>';
      P.forEach(function(p){h+='<option'+(p===s.country?' selected':'')+'>'+p+'</option>'});
      h+='</select></div><div class="act"><button class="send" data-sendidea>Sumá tu mirada</button></div>';
    }
    h+='</div></div>';
  }
  h+='</div>';
  return h;
}

function render(){
  document.getElementById('d').innerHTML=site('d');
}
function go(sc){
  if(S.scene===sc&&sc!=='idea')sc='home';
  S.scene=sc;if(sc==='idea')S.sent=false;if(sc==='foro')S.qsent=false;
  render();
  if(sc==='crisis'||sc==='foro'){var p=document.querySelector('.panel');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})}
}
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.go){go(t.dataset.go)}
  else if(t.dataset.sel!==undefined){S.sel=+t.dataset.sel;render()}
  else if(t.dataset.join!==undefined){var i=t.dataset.join;S.joined[i]=!S.joined[i];render()}
  else if(t.hasAttribute('data-close')){S.scene='home';render()}
  else if(t.hasAttribute('data-sendidea')){if(words(S.idea)<1){return}S.sent=true;render()}
  else if(t.hasAttribute('data-sendq')){if(!S.q.trim())return;S.qsent=true;render()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute('data-idea')){S.idea=t.value;document.querySelectorAll('[data-cnt]').forEach(function(c){c.textContent=words(S.idea)});document.querySelectorAll('[data-idea]').forEach(function(a){if(a!==t)a.value=S.idea})}
  if(t.hasAttribute('data-q')){S.q=t.value;document.querySelectorAll('[data-q]').forEach(function(a){if(a!==t)a.value=S.q})}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.hasAttribute('data-cr')){S.sel=+t.value;render()}
  if(t.hasAttribute('data-pa')){S.country=t.value;render()}
});
render();
</script>
